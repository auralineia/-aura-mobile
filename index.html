<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101820"><title>FRONTIER | Open World</title></head>
<body style="margin:0;background:#101820;color:#eaf4fa;font:16px system-ui;display:grid;min-height:100vh;place-items:center">
<div id="loading" style="text-align:center;padding:24px">FRONTIER<br><small style="color:#a9bdca">Carregando o mundo...</small></div>
<script>
(async()=>{try{
const response=await fetch('./frontier_payload.b64',{cache:'no-store'});
if(!response.ok)throw new Error('Não foi possível carregar os arquivos do jogo ('+response.status+').');
const encoded=(await response.text()).trim();
const binary=atob(encoded),bytes=new Uint8Array(binary.length);
for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
if(!('DecompressionStream' in window))throw new Error('Este navegador não oferece suporte ao carregamento compactado. Atualize o Safari.');
const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
const html=await new Response(stream).text();
document.open();document.write(html);document.close();
}catch(error){document.getElementById('loading').innerHTML='FRONTIER<br><small style="color:#ffb7ad">'+error.message+'</small>';}}
)();
</script></body></html>
