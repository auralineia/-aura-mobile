<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101820">
<title>FRONTIER | Open World</title>
<style>body{margin:0;background:#101820;color:#eaf4fa;font:16px system-ui;min-height:100vh;display:grid;place-items:center}#loading{text-align:center;padding:24px}small{color:#a9bdca}</style>
</head>
<body>
<div id="loading">FRONTIER<br><small>Carregando o mundo...</small></div>
<script>
(async()=>{
try{
 const paths=[1,2,3,4,5,6,7].map(n=>'./frontier_payload_v03_'+n+'.txt');
 const responses=await Promise.all(paths.map(path=>fetch(path,{cache:'no-store'})));
 const bad=responses.findIndex(response=>!response.ok);
 if(bad!==-1) throw new Error('Falha ao carregar parte '+(bad+1)+' do jogo.');
 const chunks=await Promise.all(responses.map(response=>response.text()));
 const encoded=chunks.join('').trim();
 const binary=atob(encoded);
 const bytes=new Uint8Array(binary.length);
 for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
 if(!('DecompressionStream' in window)) throw new Error('Atualize o Safari para abrir esta versão.');
 const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
 const html=await new Response(stream).text();
 document.open();document.write(html);document.close();
}catch(error){
 document.getElementById('loading').innerHTML='FRONTIER<br><small style="color:#ffb7ad">'+error.message+'</small>';
}
})();
</script>
</body>
</html>
