<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d13"><title>FRONTIER | Mundo Aberto</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d13;color:#eef6ff;font-family:Inter,system-ui,sans-serif;touch-action:none}#game{width:100%;height:100%;display:block}#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;gap:8px;padding:12px}.glass{background:#0b1420dc;border:1px solid #ffffff24;border-radius:13px;padding:9px 12px;backdrop-filter:blur(12px);font-size:12px}.logo{font-weight:950;letter-spacing:2px;color:#bce7ff}.cash{color:#8effb7;font-weight:800}.zone{position:absolute;top:66px;left:12px;font-size:11px;letter-spacing:1.5px;color:#d3e5f4}.objective{position:absolute;top:91px;left:12px;max-width:230px}.right{position:absolute;right:12px;top:66px;width:190px;line-height:1.5}.right b{color:#bce7ff}.bottom{position:absolute;bottom:14px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end}.stick{width:122px;height:122px;border:1px solid #ffffff35;background:#ffffff12;border-radius:50%;position:relative;pointer-events:auto}.knob{position:absolute;width:46px;height:46px;left:37px;top:37px;border-radius:50%;background:#d9efffcc}.actions{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:65%}button{border:1px solid #ffffff35;background:#101c2bdf;color:white;border-radius:12px;padding:11px 12px;font-weight:750;font-size:11px}button.primary{background:#c7eaff;color:#07121c}.toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:#0b1725f2;border:1px solid #8bd2ff66;border-radius:14px;padding:14px 18px;display:none;text-align:center;max-width:85%;font-size:13px}.menu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,90vw);max-height:75vh;overflow:auto;background:#0b1420f5;border:1px solid #ffffff2b;border-radius:18px;padding:18px;display:none;pointer-events:auto}.menu h2{margin:0 0 8px;color:#c5eaff}.menu p{font-size:12px;color:#b6c6d6}.menu button{margin:4px}.cross{position:absolute;left:50%;top:50%;width:7px;height:7px;border:1px solid #fff9;border-radius:50%}@media(max-width:600px){.right{width:145px;font-size:10px}.stick{width:112px;height:112px}.knob{left:33px;top:33px}.glass{font-size:10px;padding:8px}.actions button{padding:10px 9px}}
</style></head><body><canvas id="game"></canvas><div id="hud">
<div class="top"><div class="glass logo">FRONTIER <span style="color:white;font-weight:500">OPEN WORLD</span></div><div class="glass" id="status">EXPLORADOR · NÍVEL 1</div><div class="glass cash" id="cash">$ 2.500</div></div>
<div class="zone" id="zone">LOOTY BAY / COSTA CENTRAL</div><div class="glass objective" id="objective">Objetivo: explore o mundo e encontre oportunidades.</div>
<div class="glass right"><b id="maptitle">LOOTY BAY</b><br><span id="mapdesc">Distrito costeiro urbano.</span><br><br>Vida <span id="hp">100</span> · Energia <span id="energy">100</span><br>Inventário <span id="items">0</span> itens</div>
<div class="cross"></div><div class="toast" id="toast"></div><div class="menu" id="menu"></div>
<div class="bottom"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button id="maps">MAPAS</button><button id="inventory">MOCHILA</button><button id="camera">3ª PESSOA</button><button id="sprint">CORRER</button><button class="primary" id="interact">INTERAGIR</button></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=s=>document.querySelector(s),canvas=$('#game'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,300);scene.background=new THREE.Color(0x9bb9c7);scene.fog=new THREE.Fog(0x9bb9c7,55,175);
scene.add(new THREE.HemisphereLight(0xe0f2ff,0x48545b,2));const sun=new THREE.DirectionalLight(0xffe4c2,2);sun.position.set(-35,60,30);sun.castShadow=true;scene.add(sun);
const material=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const world=new THREE.Group();scene.add(world);const player=new THREE.Group();const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.43,.85,4,8),material(0x172536));torso.position.y=1.12;torso.castShadow=true;player.add(torso);const jacket=new THREE.Mesh(new THREE.BoxGeometry(.82,.6,.48),material(0x3987a5));jacket.position.y=1.25;player.add(jacket);const head=new THREE.Mesh(new THREE.SphereGeometry(.29,16,12),material(0xc99575));head.position.y=1.92;player.add(head);scene.add(player);
const state={zone:'looty',cash:2500,hp:100,energy:100,items:[],level:1,third:true,running:false,move:{x:0,z:0},near:null,missions:0,vehicle:false};
const zones={
looty:{name:'LOOTY BAY',sub:'COSTA CENTRAL',desc:'Cidade costeira: comércio, banco, delegacia e oportunidades.',sky:0x9bb9c7,ground:0x66796d,water:true,build:true,spots:[['BANCO',-22,-16],['DELEGACIA',25,-13],['MERCADO',-26,23],['GARAGEM',26,25],['JOALHERIA',0,-29],['HOTEL',35,0]]},
desert:{name:'WORLD / DESERT',sub:'TERRITÓRIO ABERTO',desc:'Dunas, ruínas, postos avançados, recursos e territórios.',sky:0xd9ae7a,ground:0xb99a69,water:false,build:false,spots:[['POSTO AVANÇADO',-25,-15],['RUÍNAS',22,-20],['POÇO DE RECURSOS',-20,25],['TORRE DE CONTROLE',27,25]]},
lair:{name:'LAIR / BASE',sub:'REFÚGIO PESSOAL',desc:'Base privada, depósito, oficina, garagem e melhorias.',sky:0x8295a8,ground:0x505c68,water:false,build:true,spots:[['DEPÓSITO',-15,-12],['OFICINA',16,-12],['GARAGEM',0,20],['MESA DE CONSTRUÇÃO',25,20]]},
prison:{name:'PRISON',sub:'COMPLEXO PENITENCIÁRIO',desc:'Pátio, blocos, atividades e sistema de progressão.',sky:0x9a9b98,ground:0x77766f,water:false,build:true,spots:[['BLOCO A',-20,-15],['PÁTIO',0,0],['REFEITÓRIO',22,-15],['PORTÃO',0,28]]},
settlement:{name:'SETTLEMENT',sub:'FRONTEIRA EM EXPANSÃO',desc:'Lotes, comércio, construção e desenvolvimento comunitário.',sky:0xa7b9a0,ground:0x71866a,water:false,build:true,spots:[['CENTRO COMERCIAL',-20,-15],['LOTE LIVRE',18,-18],['MERCADO LOCAL',-20,20],['PREFEITURA',22,20]]}
};
function clearWorld(){while(world.children.length){const o=world.children.pop();o.geometry?.dispose();if(o.material&&!Array.isArray(o.material))o.material.dispose()}}
function block(x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(c));m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;world.add(m);return m}
function marker(x,z,label,color){const g=new THREE.Group();g.position.set(x,0,z);const base=new THREE.Mesh(new THREE.CylinderGeometry(2,2,.2,20),material(color));base.position.y=.12;g.add(base);const ring=new THREE.Mesh(new THREE.TorusGeometry(2,.1,8,28),material(0xffffff));ring.rotation.x=Math.PI/2;ring.position.y=.3;g.add(ring);g.userData.label=label;world.add(g);return g}
let spots=[];
function buildZone(id){const z=zones[id];clearWorld();scene.background.setHex(z.sky);scene.fog.color.setHex(z.sky);const floor=new THREE.Mesh(new THREE.PlaneGeometry(180,180),material(z.ground));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;world.add(floor);
if(z.water){const sea=new THREE.Mesh(new THREE.PlaneGeometry(180,48),material(0x347b9a,.5));sea.rotation.x=-Math.PI/2;sea.position.set(0,.03,-67);world.add(sea)}
for(let i=-4;i<=4;i++){block(i*14,.015,0,1,.035,112,0x39434a);block(0,.02,i*14,112,.035,1,0x39434a)}
for(let x=-3;x<=3;x++)for(let zz=-3;zz<=3;zz++){if(Math.abs(x)<1&&Math.abs(zz)<1)continue;const h=id==='desert'?2+Math.random()*5:5+Math.random()*13,w=5+Math.random()*4,d=5+Math.random()*4;let colors=id==='desert'?[0x9c7448,0xb58c5c,0x78624c]:id==='prison'?[0x777b7b,0x999b98]:id==='lair'?[0x465461,0x687681]:id==='settlement'?[0x9c927a,0x73866b,0xb1a68b]:[0x71828a,0xb2a28d,0x63737d,0xc1c2ba];block(x*16,.08,zz*16,w,h,d,colors[Math.floor(Math.random()*colors.length)])}
spots=z.spots.map((s,i)=>marker(s[1],s[2],s[0],[0x56b6ff,0xff7777,0xffd16a,0xb98aff,0x8dffb7,0xffffff][i%6]));
player.position.set(0,0,8);$('#zone').textContent=z.name+' / '+z.sub;$('#maptitle').textContent=z.name;$('#mapdesc').textContent=z.desc;$('#objective').textContent='Objetivo: '+z.desc;notify('Área carregada: '+z.name)}
function notify(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(notify.t);notify.t=setTimeout(()=>$('#toast').style.display='none',2100)}
function showMenu(title,body,buttons){const m=$('#menu');m.innerHTML='<h2>'+title+'</h2><p>'+body+'</p>'+buttons.map((b,i)=>'<button data-i="'+i+'">'+b.label+'</button>').join('')+'<button data-close="1">FECHAR</button>';m.style.display='block';m.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{if(btn.dataset.close){m.style.display='none';return}buttons[+btn.dataset.i].action();m.style.display='none'})}
function openMaps(){showMenu('MUNDO FRONTIER','Escolha uma região para viajar. Cada área tem atividades e pontos próprios.',Object.entries(zones).map(([id,z])=>({label:z.name,action:()=>{state.zone=id;buildZone(id)}})))}
function openInventory(){showMenu('MOCHILA','Dinheiro: $'+state.cash.toLocaleString('pt-BR')+' · Itens: '+(state.items.length?state.items.join(', '):'vazio')+'.', [{label:'USAR KIT MÉDICO',action:()=>{if(state.items.includes('Kit médico')){state.items.splice(state.items.indexOf('Kit médico'),1);state.hp=Math.min(100,state.hp+35);sync();notify('Vida recuperada.')}else notify('Você não possui kit médico.')}},{label:'COMPRAR KIT ($150)',action:()=>{if(state.cash>=150){state.cash-=150;state.items.push('Kit médico');sync();notify('Kit médico comprado.')}else notify('Dinheiro insuficiente.')}}])}
function sync(){$('#cash').textContent='$ '+state.cash.toLocaleString('en-US');$('#hp').textContent=state.hp;$('#energy').textContent=state.energy;$('#items').textContent=state.items.length;$('#status').textContent='EXPLORADOR · NÍVEL '+state.level}
function interact(){const p=state.near;if(!p){notify('Aproxime-se de um ponto marcado.');return}const label=p.userData.label;
if(label==='MERCADO'||label==='MERCADO LOCAL'){showMenu(label,'Comércio local. Compre suprimentos para sua jornada.',[{label:'KIT MÉDICO $150',action:()=>buy('Kit médico',150)},{label:'SUPRIMENTOS $75',action:()=>buy('Suprimentos',75)}]);return}
if(label==='BANCO'){showMenu('BANCO','Serviços financeiros da cidade.',[{label:'TRABALHO RÁPIDO +$250',action:()=>job(250)},{label:'CONSULTAR SALDO',action:()=>notify('Saldo: $'+state.cash)}]);return}
if(label==='DELEGACIA'||label==='PORTÃO'){showMenu('SEGURANÇA','Área de segurança e controle de acesso.',[{label:'ACEITAR SERVIÇO +$180',action:()=>job(180)}]);return}
if(label==='GARAGEM'||label==='OFICINA'){showMenu('GARAGEM','Gestão de veículos e manutenção.',[{label:'SERVIÇO DE ENTREGA +$300',action:()=>job(300)},{label:'REPARAR VEÍCULO $100',action:()=>notify('Nenhum veículo danificado.') }]);return}
if(label==='POÇO DE RECURSOS'||label==='RUÍNAS'){state.items.push('Recurso');sync();notify('Recurso coletado!');return}
if(label==='LOTE LIVRE'||label==='MESA DE CONSTRUÇÃO'){showMenu('CONSTRUÇÃO','Desenvolvimento territorial: adquira uma melhoria para sua área.',[{label:'MELHORIA $500',action:()=>{if(state.cash>=500){state.cash-=500;state.level++;sync();notify('Melhoria construída. Nível aumentado!')}else notify('Dinheiro insuficiente.')}}]);return}
if(label==='DEPÓSITO'){showMenu('DEPÓSITO','Armazene recursos ou recupere itens.',[{label:'GUARDAR 1 RECURSO',action:()=>{const i=state.items.indexOf('Recurso');if(i>=0){state.items.splice(i,1);sync();notify('Recurso armazenado.')}else notify('Nenhum recurso para guardar.')}}]);return}
if(label==='JOALHERIA'){job(400);return}
if(label==='HOTEL'){showMenu('HOTEL','Descanso e recuperação.',[{label:'DESCANSAR $50',action:()=>{if(state.cash>=50){state.cash-=50;state.hp=100;state.energy=100;sync();notify('Descansou. Vida e energia restauradas.')}else notify('Dinheiro insuficiente.')}}]);return}
job(120)}
function buy(item,cost){if(state.cash<cost){notify('Dinheiro insuficiente.');return}state.cash-=cost;state.items.push(item);sync();notify(item+' adquirido.')}
function job(reward){state.cash+=reward;state.missions++;state.level=Math.max(state.level,1+Math.floor(state.missions/4));sync();notify('Trabalho concluído: +$'+reward+' · missões '+state.missions)}
$('#maps').onclick=openMaps;$('#inventory').onclick=openInventory;$('#interact').onclick=interact;$('#camera').onclick=()=>{state.third=!state.third;$('#camera').textContent=state.third?'3ª PESSOA':'1ª PESSOA'};$('#sprint').onpointerdown=()=>state.running=true;$('#sprint').onpointerup=()=>state.running=false;
const stick=$('#stick'),knob=$('#knob');let pointer=null;stick.onpointerdown=e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);stickMove(e)};stick.onpointermove=e=>{if(pointer===e.pointerId)stickMove(e)};stick.onpointerup=()=>{pointer=null;state.move={x:0,z:0};knob.style.transform='translate(0,0)'};function stickMove(e){const r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.hypot(dx,dy),k=Math.min(38,l),a=Math.atan2(dy,dx);state.move={x:Math.cos(a)*k/38,z:Math.sin(a)*k/38};knob.style.transform='translate('+Math.cos(a)*k+'px,'+Math.sin(a)*k+'px)'}
addEventListener('keydown',e=>{if(e.key==='w'||e.key==='ArrowUp')state.move.z=-1;if(e.key==='s'||e.key==='ArrowDown')state.move.z=1;if(e.key==='a'||e.key==='ArrowLeft')state.move.x=-1;if(e.key==='d'||e.key==='ArrowRight')state.move.x=1;if(e.key==='Shift')state.running=true;if(e.key==='e')interact()});addEventListener('keyup',e=>{if(['w','s','ArrowUp','ArrowDown'].includes(e.key))state.move.z=0;if(['a','d','ArrowLeft','ArrowRight'].includes(e.key))state.move.x=0;if(e.key==='Shift')state.running=false});
function loop(){requestAnimationFrame(loop);const m=state.move,l=Math.hypot(m.x,m.z);if(l>.05){const speed=state.running?.23:.13;player.position.x+=m.x*speed;player.position.z+=m.z*speed;player.rotation.y=Math.atan2(m.x,m.z);state.energy=Math.max(0,state.energy-(state.running?.035:.005));}else state.energy=Math.min(100,state.energy+.025);player.position.x=THREE.MathUtils.clamp(player.position.x,-60,60);player.position.z=THREE.MathUtils.clamp(player.position.z,-60,60);state.near=null;let best=8;for(const p of spots){const d=p.position.distanceTo(player.position);if(d<best){best=d;state.near=p}}if(state.near)$('#objective').textContent='Perto de: '+state.near.userData.label+' · toque INTERAGIR';if(state.third){const off=new THREE.Vector3(0,5,9).applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y);camera.position.lerp(player.position.clone().add(off),.1);camera.lookAt(player.position.x,1.1,player.position.z)}else{camera.position.set(player.position.x,1.75,player.position.z);camera.rotation.set(0,player.rotation.y,0)}sync();renderer.render(scene,camera)}
buildZone('looty');loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
