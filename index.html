<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>FRONTIER | Open World</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#eaf4fa;font:16px system-ui}
#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:24px;box-sizing:border-box}
#loading small{color:#a9bdca;margin-top:10px}
#loading .err{color:#ffb7ad}
</style>
</head>
<body>
<div id="loading"><strong style="font-size:28px;letter-spacing:5px">FRONTIER</strong><small>Carregando o mundo...</small></div>
<script>
(async()=>{
const base='https://raw.githubusercontent.com/auralineia/-aura-mobile/main/';
try{
 const paths=[1,2,3,4,5,6,7].map(n=>base+'frontier_payload_v03_'+n+'.txt?rev=3');
 const responses=await Promise.all(paths.map(path=>fetch(path,{cache:'no-store'})));
 const bad=responses.findIndex(response=>!response.ok);
 if(bad!==-1) throw new Error('Falha ao carregar parte '+(bad+1)+' ('+responses[bad].status+').');
 const chunks=await Promise.all(responses.map(response=>response.text()));
 const encoded=chunks.join('').replace(/\\s/g,'');
 const binary=atob(encoded);
 const bytes=new Uint8Array(binary.length);
 for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
 if(!('DecompressionStream' in window)) throw new Error('Este Safari não oferece suporte ao formato do jogo. Atualize o iOS.');
 const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
 let html=await new Response(stream).text();
 const landscape=`
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
#frontier-rotate-note{display:none}
@media(orientation:portrait){
 #frontier-rotate-note{display:flex;position:fixed;inset:0;z-index:2147483647;background:#101820;color:#eef7ff;align-items:center;justify-content:center;text-align:center;padding:28px;box-sizing:border-box;font:600 18px system-ui}
 #frontier-rotate-note span{display:block;font-size:42px;margin-bottom:18px}
}
</style>
`;
 const note='<div id="frontier-rotate-note"><div><span>↻</span>Gire o celular para jogar na horizontal.<br><small style="font-weight:400;color:#9eb2c2">FRONTIER foi projetado para tela deitada.</small></div></div>';
 html=html.replace('</head>',landscape+'</head>');
 html=html.replace('<body>','<body>'+note);
 document.open();document.write(html);document.close();
}catch(error){
 document.getElementById('loading').innerHTML='<strong style="font-size:28px;letter-spacing:5px">FRONTIER</strong><small class="err">'+error.message+'</small>';
}
})();
</script>
</body>
</html>
