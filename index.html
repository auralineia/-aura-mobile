<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0d12"><title>FRONTIER | Looty Bay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d12;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;touch-action:none}#game{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:16px;gap:10px}.pill{background:#101722d9;border:1px solid #ffffff22;border-radius:14px;padding:10px 13px;backdrop-filter:blur(12px);font-size:13px}.brand{font-weight:900;letter-spacing:2px;color:#b7e5ff}.money{font-weight:800;color:#8dffbd}.hint{position:absolute;top:76px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#cbd5e1;font-size:12px;background:#0b1220bb;padding:8px 12px;border-radius:20px}.bottom{position:absolute;bottom:18px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:end}.joystick{width:128px;height:128px;border-radius:50%;background:#ffffff12;border:1px solid #ffffff35;position:relative;pointer-events:auto;backdrop-filter:blur(8px)}.knob{position:absolute;width:48px;height:48px;border-radius:50%;background:#d8efffbb;left:39px;top:39px;box-shadow:0 0 24px #65baff66}.actions{display:flex;gap:9px;pointer-events:auto;align-items:end}.act{border:1px solid #ffffff38;background:#101722dd;color:white;border-radius:15px;padding:13px 15px;font-weight:700}.act.primary{background:#c7eaff;color:#08111b}.panel{position:absolute;right:16px;top:76px;width:min(230px,48vw);background:#101722e8;border:1px solid #ffffff22;border-radius:16px;padding:13px;font-size:12px;line-height:1.55}.panel b{color:#b7e5ff}.toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:#0d1725ee;border:1px solid #8bd2ff66;border-radius:14px;padding:14px 18px;display:none;text-align:center}.cross{position:absolute;left:50%;top:50%;width:8px;height:8px;border:1px solid #ffffffaa;border-radius:50%;transform:translate(-50%,-50%);opacity:.65}
@media(min-width:800px){.joystick{width:145px;height:145px}.knob{left:48px;top:48px}.panel{width:250px}}
</style>
</head>
<body>
<canvas id="game"></canvas><div id="hud">
<div class="top"><div class="pill brand">FRONTIER <span style="color:#fff;font-weight:500">/ LOOTY BAY</span></div><div class="pill">STATUS <b style="color:#8dffbd">ONLINE</b></div><div class="pill money" id="cash">$ 2,500</div></div>
<div class="hint" id="hint">Explore a cidade • aproxime-se dos pontos de interesse</div>
<div class="panel"><b>LOOTY BAY</b><br>Distrito costeiro<br><br>🟦 Banco · 🟥 Polícia<br>🟨 Mercado · 🟪 Garagem<br><br><span style="color:#9aa9bb">WASD / setas ou joystick para mover. Use os botões para interagir.</span></div>
<div class="cross"></div><div class="toast" id="toast"></div>
<div class="bottom"><div class="joystick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button class="act" id="cam">3ª PESSOA</button><button class="act" id="run">CORRER</button><button class="act primary" id="use">INTERAGIR</button></div></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#game'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bb8c6);scene.fog=new THREE.Fog(0x9bb8c6,45,145);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,250);
scene.add(new THREE.HemisphereLight(0xd9edff,0x4c5a62,2));const sun=new THREE.DirectionalLight(0xffe5c2,2.1);sun.position.set(-35,55,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const mat=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),mat(0x657c72));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(220,65),mat(0x397e9b,.55));sea.rotation.x=-Math.PI/2;sea.position.set(0,.04,-76);scene.add(sea);
function box(x,y,z,w,h,d,color){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
for(let i=-5;i<=5;i++){box(i*13,.02,0,1.4,.04,105,0x303a40);box(0,.025,i*12,105,.04,1.4,0x303a40)}
const buildings=[];for(let x=-4;x<=4;x++)for(let z=-4;z<=4;z++){if(Math.abs(x)<2&&Math.abs(z)<2)continue;let h=5+Math.random()*16,w=5+Math.random()*3,d=5+Math.random()*3;let b=box(x*13,.1,z*12,w,h,d,[0x89959a,0x687d89,0xb5a18b,0x586b73,0xc2c5be][Math.floor(Math.random()*5)]);buildings.push(b);for(let yy=2;yy<h-1;yy+=2.6)for(let xx=-w/2+1;xx<w/2;xx+=2){let win=new THREE.Mesh(new THREE.BoxGeometry(.9,.8,.08),mat(0x9fd8e8,.3));win.position.set(b.position.x+xx,yy,b.position.z+d/2+.05);scene.add(win)}}
function marker(x,z,color,label){const g=new THREE.Group();g.position.set(x,0,z);const base=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.2,.25,24),mat(color));base.position.y=.18;g.add(base);const ring=new THREE.Mesh(new THREE.TorusGeometry(2.2,.12,8,32),mat(0xffffff));ring.rotation.x=Math.PI/2;ring.position.y=.4;g.add(ring);scene.add(g);g.userData.label=label;return g}
const points=[marker(-22,-16,0x42a5ff,'BANCO'),marker(25,-13,0xff6262,'POLÍCIA'),marker(-26,23,0xffd166,'MERCADO'),marker(26,25,0xb78aff,'GARAGEM')];
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.9,4,8),mat(0x182333));body.position.y=1.15;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),mat(0xd6a17d));head.position.y=2;player.add(head);const jacket=new THREE.Mesh(new THREE.BoxGeometry(.9,.65,.5),mat(0x3b8caa));jacket.position.y=1.3;player.add(jacket);scene.add(player);player.position.set(0,0,8);
let move={x:0,z:0},running=false,third=true,cash=2500,near=null;const cashEl=document.querySelector('#cash'),toast=document.querySelector('#toast'),hint=document.querySelector('#hint');
function notify(s){toast.textContent=s;toast.style.display='block';clearTimeout(notify.t);notify.t=setTimeout(()=>toast.style.display='none',1900)}
function interact(){if(!near){notify('Nenhum ponto de interesse próximo.');return}if(near.userData.label==='MERCADO'){cash=Math.max(0,cash-50);notify('Suprimentos adquiridos: -$50')}else if(near.userData.label==='BANCO'){notify('Banco: serviços financeiros em desenvolvimento.')}else if(near.userData.label==='POLÍCIA'){notify('Delegacia: área de segurança.')}else{notify('Garagem: veículos em desenvolvimento.')}cashEl.textContent='$ '+cash.toLocaleString('en-US')}
document.querySelector('#use').onclick=interact;document.querySelector('#run').onpointerdown=()=>running=true;document.querySelector('#run').onpointerup=()=>running=false;document.querySelector('#cam').onclick=()=>{third=!third;document.querySelector('#cam').textContent=third?'3ª PESSOA':'1ª PESSOA'};
const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');let pointer=null;stick.onpointerdown=e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);stickMove(e)};stick.onpointermove=e=>{if(pointer===e.pointerId)stickMove(e)};stick.onpointerup=()=>{pointer=null;move={x:0,z:0};knob.style.transform='translate(0,0)'};function stickMove(e){const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),k=Math.min(39,len),a=Math.atan2(dy,dx);move={x:Math.cos(a)*k/39,z:Math.sin(a)*k/39};knob.style.transform=`translate(${Math.cos(a)*k}px,${Math.sin(a)*k}px)`}
addEventListener('keydown',e=>{if(['w','ArrowUp'].includes(e.key))move.z=-1;if(['s','ArrowDown'].includes(e.key))move.z=1;if(['a','ArrowLeft'].includes(e.key))move.x=-1;if(['d','ArrowRight'].includes(e.key))move.x=1;if(e.key==='Shift')running=true;if(e.key==='e')interact()});addEventListener('keyup',e=>{if(['w','s','ArrowUp','ArrowDown'].includes(e.key))move.z=0;if(['a','d','ArrowLeft','ArrowRight'].includes(e.key))move.x=0;if(e.key==='Shift')running=false});
function animate(){requestAnimationFrame(animate);const len=Math.hypot(move.x,move.z);if(len>.08){const speed=running?.24:.13;player.position.x+=move.x*speed;player.position.z+=move.z*speed;player.rotation.y=Math.atan2(move.x,move.z);body.rotation.z=Math.sin(Date.now()*.012)*.05}player.position.x=THREE.MathUtils.clamp(player.position.x,-56,56);player.position.z=THREE.MathUtils.clamp(player.position.z,-53,53);
near=null;let dist=99;for(const p of points){let d=p.position.distanceTo(player.position);if(d<dist){dist=d;near=p}}hint.textContent=dist<7?'Ponto próximo: '+near.userData.label+' • toque em INTERAGIR':'Explore a cidade • aproxime-se dos pontos de interesse';
if(third){const offset=new THREE.Vector3(0,5,9).applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y);camera.position.lerp(player.position.clone().add(offset),.09);camera.lookAt(player.position.x,player.position.y+1,player.position.z)}else{camera.position.set(player.position.x,player.position.y+1.8,player.position.z);camera.rotation.set(0,player.rotation.y,0)}
renderer.render(scene,camera)}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
